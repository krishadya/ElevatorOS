[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elevatoros"
version = "0.1.0"
description = "Multi-elevator dispatch simulation and benchmarking platform"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
